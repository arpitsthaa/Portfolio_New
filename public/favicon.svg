<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#0D0F0E"/>
  <!-- Green border accent -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#7FE0A8" stroke-width="2" opacity="0.6"/>
  <!-- Terminal prompt ">" symbol -->
  <text x="9" y="30" font-family="monospace" font-size="22" font-weight="700" fill="#7FE0A8">A</text>
  <!-- Underline cursor bar -->
  <text x="36" y="30" font-family="monospace" font-size="22" font-weight="700" fill="#4AAA78">S</text>
  <!-- Blinking cursor line -->
  <rect x="9" y="44" width="46" height="3" rx="1.5" fill="#7FE0A8" opacity="0.35"/>
  <!-- Subtle dot in corner for terminal feel -->
  <circle cx="54" cy="12" r="3" fill="#7FE0A8" opacity="0.5"/>
</svg>